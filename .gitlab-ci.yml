stages:
  - verify
  - docker

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  MVN_CMD: "mvn -B -ntp"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .m2/repository

verify:
  stage: verify
  image: maven:3.9.9-eclipse-temurin-17
  script:
    - $MVN_CMD verify
  artifacts:
    when: always
    reports:
      junit:
        - "Bank Infrastructure/target/surefire-reports/TEST-*.xml"
        - "Bank User Domain/target/surefire-reports/TEST-*.xml"
        - "Bank Fund Domain/target/surefire-reports/TEST-*.xml"

docker-build:
  stage: docker
  image: docker:27.3.1
  services:
    - docker:27.3.1-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    IMAGE_TAG: "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
  needs:
    - verify
  script:
    - docker build --build-arg SPRING_PROFILES_ACTIVE=prod -t "$IMAGE_TAG" .
    - |
      if [ -n "$CI_REGISTRY" ] && [ -n "$CI_REGISTRY_USER" ] && [ -n "$CI_REGISTRY_PASSWORD" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        docker push "$IMAGE_TAG"
      else
        echo "Registry credentials not provided, skipping docker push step."
      fi

