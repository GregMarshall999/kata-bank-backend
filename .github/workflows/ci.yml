name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  verify:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run unit tests
        run: mvn -B -ntp verify

  docker-image:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ${{ secrets.CONTAINER_REGISTRY || 'ghcr.io' }}
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        run: docker build --build-arg SPRING_PROFILES_ACTIVE=prod -t $REGISTRY/$IMAGE_NAME:${{ github.sha }} .

      - name: Log in to registry
        if: ${{ github.event_name == 'push' && secrets.REGISTRY_USERNAME != '' && secrets.REGISTRY_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.CONTAINER_REGISTRY || 'ghcr.io' }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Push container image
        if: ${{ github.event_name == 'push' && secrets.REGISTRY_USERNAME != '' && secrets.REGISTRY_PASSWORD != '' }}
        run: docker push $REGISTRY/$IMAGE_NAME:${{ github.sha }}

