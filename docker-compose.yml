version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: kata-bank-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: kata_bank
      MYSQL_USER: kata_user
      MYSQL_PASSWORD: kata_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - kata-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  kata-bank-api:
    build: .
    container_name: kata-bank-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DATABASE_URL=jdbc:mysql://mysql:3306/kata_bank?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - DATABASE_USERNAME=kata_user
      - DATABASE_PASSWORD=kata_password
      - JWT_SECRET=ZG9ja2VyLWp3dC1zZWNyZXQta2V5LWZvci1kZXZlbG9wbWVudC1vbmx5
      - JWT_EXPIRATION=86400000
      - LOG_LEVEL_ROOT=INFO
      - LOG_LEVEL_WEB=DEBUG
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - kata-network
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kata-bank-redis
    ports:
      - "6379:6379"
    networks:
      - kata-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: kata-bank-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - kata-bank-api
    networks:
      - kata-network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  kata-network:
    driver: bridge
